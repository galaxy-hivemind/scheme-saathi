<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>
  
  <!-- Center Emblem (Government Welfare Star & Sparkle) -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Center 4-point Sparkle Star -->
    <path d="M256 96 C256 184 328 256 416 256 C328 256 256 328 256 416 C256 328 184 256 96 256 C184 256 256 184 256 96 Z"/>
    
    <!-- Top-Right Accent Sparkle -->
    <path d="M370 120 C370 145 390 165 415 165 C390 165 370 185 370 210 C370 185 350 165 325 165 C350 165 370 145 370 120 Z" fill-opacity="0.85"/>
  </g>
</svg>